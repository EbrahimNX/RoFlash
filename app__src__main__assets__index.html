:root{--p:#6C5CE7;--p2:#8E7CFF;--pk:#FF6FA5;--am:#FFC24B;--mt:#2ED8A7;--co:#FF5C7A;--bg:#F4F2FF;--g2:#E7E4F7;--g3:#8A87A8;--t:#1E1B3A;--gr:linear-gradient(135deg,#6C5CE7,#8E7CFF);--ga:linear-gradient(135deg,#FFC24B,#FF9F5A);--sh:0 6px 24px rgba(108,92,231,.10);--ez:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Montserrat Alternates',system-ui,sans-serif;background:var(--bg);color:var(--t);overflow-x:hidden}html{overflow-x:hidden}body::before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 50% at 0 0,#E6E0FF,transparent 60%)}
button,input{font:inherit}h1{font-size:30px;margin:6px 4px 22px}h2,h3{margin:0}.m{color:var(--g3)}.row{display:flex;align-items:center;gap:10px}
#a{padding:22px 18px 200px;min-height:100vh}
@keyframes inR{from{opacity:0;transform:translate3d(18px,0,0)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translate3d(-18px,0,0)}to{opacity:1;transform:none}}
@keyframes inU{from{opacity:0;transform:translate3d(0,26px,0) scale(.98)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translate3d(0,14px,0)}to{opacity:1;transform:none}}
#a{transition:opacity .11s ease,transform .11s ease}#a.out{opacity:0;transform:translate3d(0,6px,0);pointer-events:none}
#a.pf{animation:inR .34s var(--ez)}#a.pb{animation:inL .34s var(--ez)}#a.pu{animation:inU .38s var(--ez)}
#a.an .hd,#a.an .sb,#a.an .st,#a.an .stg>*,#a.an .sec{animation:up .42s var(--ez) both;animation-delay:calc(var(--i,0)*35ms)}
body.ex #a{padding:12px 14px;height:100vh;display:flex;flex-direction:column;min-height:0}body.ex #nv{display:none}
.gr{font-size:32px;font-weight:800;letter-spacing:-.5px}.sub{font-size:14px;color:var(--g3);margin:4px 0 22px}
.sb{display:flex;align-items:center;gap:12px;background:#fff;border-radius:26px;padding:8px 8px 8px 20px;margin-bottom:26px;color:var(--p);box-shadow:var(--sh)}
.sb input{flex:1;min-width:0;border:0;outline:0;background:0;font-size:17px;color:var(--t)}
.sg{width:48px;height:48px;border-radius:18px;border:0;background:var(--gr);color:#fff;display:grid;place-items:center;box-shadow:0 6px 14px rgba(108,92,231,.35)}
.st{font-size:20px;font-weight:800;margin:0 4px 16px}
.cc{background:#fff center/cover;border-radius:28px;padding:14px 14px 16px;aspect-ratio:4/5;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--sh);transition:transform .2s}.cc:active{transform:scale(.97)}
.ct{display:flex;justify-content:flex-end;gap:8px}.cb b{display:block;font-size:22px;font-weight:800;word-break:break-word}.cb small{color:var(--g3);font-weight:600}
.cc.im{color:#fff}.cc.im small{color:#e8e6f5}
.cb2{width:34px;height:34px;border-radius:50%;border:0;background:rgba(138,135,168,.16);color:inherit;display:grid;place-items:center;font-size:19px}.cc.im .cb2{background:rgba(255,255,255,.28)}.cb2.on{background:var(--p);color:#fff}.cc.im .cb2.on{background:var(--p);color:#fff}
.gd{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fcw{height:20vh;min-height:124px;perspective:900px}.fcw.hi{height:auto;aspect-ratio:1/1.2}.fi{position:relative;height:100%;transition:transform .55s var(--ez);transform-style:preserve-3d}.fcw.f .fi{transform:rotateY(180deg)}
.ff{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;font-weight:800;box-shadow:var(--sh);word-break:break-word}.bk{transform:rotateY(180deg)}
.pic{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;margin-bottom:8px;flex:none}.hi .ff{justify-content:flex-start}.hi .ff span{margin:auto 0}
.ed{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.75);color:var(--t);display:grid;place-items:center}.hi .ed{top:18px;right:18px}
#lst{display:grid;grid-template-columns:1fr;gap:16px}.hi .ff.bk{justify-content:center}
.add{border-radius:26px;background:#faf9ff;border:2px dashed #cfc9f3;display:grid;place-items:center;height:20vh;min-height:124px;color:var(--p);font-size:42px}
.ib{width:44px;height:44px;border-radius:16px;border:0;background:#fff;display:grid;place-items:center;color:var(--t);flex:none;box-shadow:var(--sh)}.ib.on{background:var(--am)}
.sec{background:#fff;border-radius:28px;padding:22px;margin-bottom:18px;box-shadow:var(--sh)}.sec h4{margin:0 0 18px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--g3)}
.rw{display:flex;align-items:center;justify-content:space-between;gap:12px}.ico{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;font-size:20px;flex:none}
.chip{display:inline-block;border-radius:999px;padding:11px 18px;margin:0 8px 10px 0;background:var(--bg);font-weight:700;transition:.2s}.chip.on{background:var(--gr);color:#fff}
input[type=number],input[type=time]{width:96px;text-align:center;padding:12px 8px;border:2px solid var(--g2);border-radius:16px;background:#fff;font-size:17px;font-weight:700;color:var(--t)}input[type=time]{width:130px}
input[type=text]{width:100%;padding:15px 18px;border:2px solid var(--g2);border-radius:18px;font-size:16px;margin:6px 0;background:#fff;color:var(--t)}input[type=text]:focus{border-color:var(--p2);outline:0}
.seg{display:flex;background:var(--bg);border-radius:20px;padding:5px}.seg button{flex:1;border:0;background:0;padding:13px;border-radius:16px;font-weight:700;color:var(--t);transition:.25s}.seg button.on{background:var(--gr);color:#fff}
.tg{width:58px;height:34px;border-radius:999px;background:var(--g2);position:relative;border:0;flex:none;transition:.3s}
.tg::after{content:'';position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.3s var(--ez);box-shadow:0 1px 4px rgba(0,0,0,.2)}.tg.on{background:var(--gr)}.tg.on::after{left:28px}
.fab{position:fixed;right:20px;bottom:104px;width:68px;height:68px;border-radius:50%;border:0;background:var(--gr);color:#fff;font-size:42px;line-height:1;box-shadow:0 10px 24px rgba(108,92,231,.45);z-index:4}
.fy{position:fixed;right:20px;bottom:104px;border:0;border-radius:22px;padding:17px 30px;background:var(--ga);color:var(--t);font-size:17px;font-weight:800;box-shadow:0 10px 24px rgba(255,159,90,.45);z-index:4}

function dm(ev){if(d0===null)return;dx=ev.clientX-d0;if(Math.abs(dx)>10)mv=true;if(mv){const w=$('sw');w.style.animation='none';w.style.transition='none';w.style.transform=`translateX(${dx}px) rotate(${dx/30}deg)`}}
function de(){if(d0===null)return;d0=null;const w=$('sw');if(!mv){X.f=!X.f;$('in').classList.toggle('f');return}
if(Math.abs(dx)>90){w.style.transition='transform .28s,opacity .28s';w.style.transform=`translateX(${dx>0?'110vw':'-110vw'})`;w.style.opacity=0;const d=dx;setTimeout(()=>nav(d>0?-1:1),230)}else{w.style.transition='transform .3s var(--ez)';w.style.transform=''}}
function nav(d){X.i=(X.i+d+X.o.length)%X.o.length;X.f=0;render()}
function rate(v){const k=X.o[X.i];k.r=v;X.r[k.id]=v;save();
if(X.i<X.o.length-1){X.i++;X.f=0;render();return}
const n=q=>Object.values(X.r).filter(x=>x==q).length,msg=`Finished! Easy ${n('e')} · Neutral ${n('n')} · Hard ${n('h')}`;endX();render('pb');toast(msg,3500)}
function shufX(){X.sh=!X.sh;X.o=X.sh?shuffle(X.base.slice()):X.base.slice();X.i=0;X.f=0;render()}
function restart(){X.r={};X.i=0;X.f=0;X.o=X.sh?shuffle(X.base.slice()):X.base.slice();render()}
function endX(){if(X&&Object.keys(X.r).length){const L={t:Date.now(),e:[],n:[],h:[]};X.base.forEach(k=>{const r=X.r[k.id];if(r)L[r].push({ro:k.ro,en:k.en||''})});S.last=L;save()}X=null}
function lastHTML(){const L=S.last;if(!L)return`<div class=sec><h4>Last exercise</h4><p class=m style="margin:0">Finish an exercise to see your results here.</p></div>`;
const d=new Date(L.t).toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const g=(k,t,c,x)=>L[k].length?`<div style="margin-top:18px"><div class=row style="margin-bottom:12px"><span class=cn style="background:${c};color:${x}">${L[k].length}</span><b>${t}</b></div>${L[k].map(w=>`<span class=chip>${e(w.ro)}${w.en?' · '+e(w.en):''}</span>`).join('')}</div>`:'';
return`<div class=sec><h4>Last exercise · ${d}</h4>${g('h','Hard','var(--co)','#fff')}${g('n','Neutral','var(--am)','var(--t)')}${g('e','Easy','var(--mt)','#fff')}</div>`}
function cf(k,v){S.cfg[k]=v;save();render()}
function togOn(){if(!S.cfg.on){let ok=true;try{ok=Android.canOverlay()}catch(x){}if(!ok){toast('Allow "Display over other apps", then switch it on again');Android.askOverlay();return}}cf('on',!S.cfg.on)}
function setHTML(){const c=S.cfg;let us=false,bo=true;try{us=Android.hasUsage()}catch(x){}try{bo=Android.batteryOk()}catch(x){}let n=0;const sc=(h)=>`class=sec style="--i:${n++}"`;
return`<h1>Preferences</h1>
<div ${sc()}><h4>Profile</h4><input type=text value="${e(c.name)}" placeholder="Your name" onchange="cf('name',this.value.trim()||'Ebrahim')"></div>
<div ${sc()}><div class=rw><div class=row><span class=ico style="background:#EDE9FF">🔔</span><div><b>Passive exposure</b><br><small class=m>Pop up cards over other apps</small></div></div><button class="tg ${c.on?'on':''}" onclick="togOn()"></button></div></div>
<div ${sc()}><h4>Frequency</h4><div class=rw><span>Show a card every</span><span class=row><input type=number min=1 value="${c.every}" onchange="cf('every',+this.value||15)"><span class=m>min</span></span></div></div>
<div ${sc()}><h4>Between</h4><div class=rw><span>All day</span><button class="tg ${c.all?'on':''}" onclick="cf('all',!S.cfg.all)"></button></div>${c.all?'':`<div class=rw style="margin-top:20px"><input type=time value="${c.from}" onchange="cf('from',this.value)"><span class=m>to</span><input type=time value="${c.to}" onchange="cf('to',this.value)"></div>`}</div>
<div ${sc()}><h4>Card face</h4><div class=seg><button class="${c.face=='ro'?'on':''}" onclick="cf('face','ro')">Romanian</button><button class="${c.face=='en'?'on':''}" onclick="cf('face','en')">English</button></div><div class=rw style="margin-top:20px"><span>Include pictures in popups</span><button class="tg ${c.pics?'on':''}" onclick="cf('pics',!S.cfg.pics)"></button></div></div>
<div ${sc()}><h4>Show cards from</h4>${S.cols.map(k=>`<span class="chip ${k.ps?'on':''}" onclick="col(${k.id}).ps=!col(${k.id}).ps;save();render()">${e(k.name)}</span>`).join('')||'<span class=m>No collections yet</span>'}</div>
<div ${sc()}><h4>Hide popups in apps</h4><div class=rw><span>${c.skip.length?c.skip.length+' apps hidden':'No apps chosen'}</span><button class="btn p" onclick="openApps()">Choose apps</button></div>${us?'':'<p class=m style="margin:16px 0 10px;font-size:13px">To know which app is open, Ro Flash needs Usage access.</p><button class=btn onclick="Android.askUsage()">Grant usage access</button>'}</div>
<div ${sc()}><h4>Reliability</h4><div class=rw><span>Run in background</span>${bo?'<span class=m>Allowed ✓</span>':'<button class="btn p" onclick="Android.askBattery()">Allow</button>'}</div><p class=m style="margin:14px 0 0;font-size:13px">Without this, some phones stop the popups once the app is closed.</p></div>
<div ${sc()}><h4>Backup</h4><div class=rw><span>All collections as text</span><button class="btn p" onclick="exp(0)">Export .txt</button></div></div>
<p class=m style="margin:0 8px">Easy cards appear less often, Hard cards more often.</p>`}
render();if(LOADED||S.cols.length)save();
</script></body></html>
