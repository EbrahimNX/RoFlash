<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--b:#002B7F;--y:#FCD116;--r:#CE1126;--g1:#f3f4f6;--g2:#e5e7eb;--g3:#6b7280;--t:#111827}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,sans-serif;background:var(--g1);color:var(--t)}
#a{padding:16px 16px 180px}h1{font-size:28px;margin:6px 4px 16px;color:var(--b)}h3{margin:0 0 8px}
.m{color:var(--g3)}.row{display:flex;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cc{border-radius:28px;padding:18px;min-height:130px;position:relative;display:flex;flex-direction:column;justify-content:flex-end}
.cc b{font-size:18px;word-break:break-word}.cc small{opacity:.85}
.dots{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.3);color:inherit;font-size:20px}
.li{background:#fff;border-radius:28px;padding:14px 18px;margin:10px 0;display:flex;gap:12px;align-items:center}
.sw{width:12px;align-self:stretch;border-radius:999px}
button,input{font:inherit}
.btn{border:0;border-radius:999px;padding:13px 22px;background:var(--b);color:#fff;font-weight:600}
.btn.g{background:#fff;color:var(--t)}.btn.on{background:var(--y);color:var(--t)}
input[type=text],input[type=time],input[type=number]{padding:12px 16px;border:2px solid var(--g2);border-radius:999px;background:#fff;margin:6px 0;width:100%}
input[type=number],input[type=time]{width:auto;max-width:130px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;padding:10px 12px calc(10px + env(safe-area-inset-bottom));gap:8px;border-radius:32px 32px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.08)}
nav button{flex:1;border:0;border-radius:999px;padding:12px;background:0;color:var(--g3);font-weight:600}nav button.on{background:var(--b);color:#fff}
.fabs{position:fixed;right:16px;bottom:96px;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.fab{width:68px;height:68px;border-radius:50%;border:0;background:var(--b);color:#fff;font-size:40px;line-height:1;box-shadow:0 6px 16px rgba(0,43,127,.4)}
.fy{border:0;border-radius:999px;padding:14px 24px;background:var(--y);color:var(--t);font-weight:700;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;z-index:9}
.sheet{background:#fff;width:100%;border-radius:32px 32px 0 0;padding:22px 20px 28px}
.sws{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.s{width:38px;height:38px;border-radius:50%;border:0;padding:0;box-shadow:0 0 0 2px var(--g2)}.s.on{box-shadow:0 0 0 3px var(--t)}
.chip{display:inline-block;border-radius:999px;padding:10px 16px;margin:4px 4px 4px 0;background:#fff;border:2px solid var(--g2);font-weight:600}.chip.on{background:var(--b);border-color:var(--b);color:#fff}
.sc{perspective:1000px;flex:1;min-width:0}.in{position:relative;height:300px;transition:transform .55s;transform-style:preserve-3d}.in.f{transform:rotateY(180deg)}
.fc{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:36px;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-weight:700;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.1);word-break:break-word}
.bk{transform:rotateY(180deg);background:var(--b);color:#fff}
.ar{width:44px;height:44px;border-radius:50%;border:0;background:#fff;font-size:22px;box-shadow:0 2px 8px rgba(0,0,0,.12);flex:none}
.tg{width:56px;height:32px;border-radius:999px;background:var(--g2);position:relative;border:0}
.tg::after{content:'';position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.tg.on{background:var(--b)}.tg.on::after{left:28px}
</style></head><body><div id="a"></div><script>
const $=i=>document.getElementById(i),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=['#002B7F','#FCD116','#CE1126','#1D4ED8','#374151','#6B7280','#9CA3AF','#111827'];
const uid=()=>Date.now()*10+Math.floor(Math.random()*10);
const tc=h=>{const n=parseInt(h.slice(1),16);return((n>>16)*.299+((n>>8)&255)*.587+(n&255)*.114)>160?'#111827':'#fff'};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fs=t=>t.length>40?20:t.length>18?26:32;
function load(){if(localStorage.v2)return JSON.parse(localStorage.v2);
const n={cols:[],cfg:{on:false,every:15,from:'08:00',to:'22:00',face:'ro'}};
try{JSON.parse(localStorage.d).sets.forEach((s,i)=>n.cols.push({id:s.id,name:s.name,color:P[i%3],ex:false,ps:true,cards:s.cards.map((c,j)=>({id:s.id+j,en:c.b,ro:c.f,color:''}))}))}catch(x){}return n}
let S=load(),T='c',cur=null,X=null,M=null;
const col=id=>S.cols.find(c=>c.id==id);
const findCard=id=>{for(const c of S.cols){const k=c.cards.find(k=>k.id==id);if(k)return k}};
const save=()=>{const j=JSON.stringify(S);localStorage.v2=j;try{Android.sync(j)}catch(x){}};
function back(){if(M){M=null}else if(X){X=null}else if(cur){cur=null}else if(T!='c'){T='c'}else return false;render();return true}
function render(){let h=X?exHTML():cur?colHTML():T=='c'?listHTML():T=='x'?exTab():setHTML();
if(!X){h+='<nav>'+[['c','Collections'],['x','Exercise'],['s','Settings']].map(([k,l])=>`<button class="${T==k?'on':''}" onclick="T='${k}';cur=null;render()">${l}</button>`).join('')+'</nav>';
if(T=='c')h+=`<div class=fabs><button class=fab onclick="M={t:'${cur?'card':'col'}',id:0};render()">+</button><button class=fy onclick="startX(${cur||0})">Exercise</button></div>`}
$('a').innerHTML=h+(M?modal():'');if(M)$('i1').focus()}
function listHTML(){return'<h1>Collections</h1><div class=grid>'+S.cols.map(c=>`<div class=cc style="background:${c.color};color:${tc(c.color)}" onclick="cur=${c.id};render()"><button class=dots onclick="event.stopPropagation();M={t:'col',id:${c.id}};render()">⋮</button><b>${e(c.name)}</b><small>${c.cards.length} cards</small></div>`).join('')+'</div>'+(S.cols.length?'':'<p class=m>Tap + to create your first collection.</p>')}
function colHTML(){const c=col(cur);return`<div class=row><button class=ar onclick="back()">‹</button><h1 style="margin:0;flex:1">${e(c.name)}</h1></div><p class=m style="margin:12px 4px">${c.cards.length} cards · tap a card to edit</p>`+c.cards.map(k=>`<div class=li onclick="M={t:'card',id:${k.id}};render()"><div class=sw style="background:${k.color||'#e5e7eb'}"></div><div style="flex:1"><b>${e(k.en)}</b><br><span class=m>${e(k.ro)}</span></div><span class=m>${k.r=='e'?'Easy':k.r=='h'?'Hard':''}</span></div>`).join('')}
function modal(){const isC=M.t=='col',k=(isC?col(M.id):findCard(M.id))||{name:'',color:isC?P[0]:'',en:'',ro:''};if(M.color===undefined)M.color=k.color;
return`<div class=modal onclick="if(event.target==this)back()"><div class=sheet><h3>${isC?(M.id?'Edit collection':'New collection'):(M.id?'Edit card':'New card')}</h3>`+
(isC?`<input type=text id=i1 placeholder="Collection name" value="${e(k.name)}">`:`<input type=text id=i1 placeholder="English" value="${e(k.en)}"><input type=text id=i2 placeholder="Romanian" value="${e(k.ro)}">`)+
'<div class=sws>'+(isC?'':`<button class="s ${M.color?'':'on'}" style="background:#fff" onclick="pick('')">∅</button>`)+P.map(p=>`<button class="s ${M.color==p?'on':''}" style="background:${p}" onclick="pick('${p}')"></button>`).join('')+'</div>'+
`<div class=row><button class=btn style="flex:1" onclick="msave()">Save</button>${M.id?'<button class="btn" style="background:var(--r)" onclick="mdel()">Delete</button>':''}</div></div></div>`}
function pick(c){M.color=c;document.querySelectorAll('.sws .s').forEach(b=>b.classList.toggle('on',b.getAttribute('onclick')=="pick('"+c+"')"))}
function msave(){const a=$('i1').value.trim();if(!a)return;
if(M.t=='col'){if(M.id){const c=col(M.id);c.name=a;c.color=M.color}else S.cols.push({id:uid(),name:a,color:M.color||P[0],cards:[],ex:false,ps:true})}
else{const b=$('i2').value.trim();if(!b)return;if(M.id){const k=findCard(M.id);k.en=a;k.ro=b;k.color=M.color}else col(cur).cards.push({id:uid(),en:a,ro:b,color:M.color})}
M=null;save();render()}
function mdel(){if(!confirm('Delete?'))return;if(M.t=='col'){S.cols=S.cols.filter(c=>c.id!=M.id);if(cur==M.id)cur=null}else S.cols.forEach(c=>c.cards=c.cards.filter(k=>k.id!=M.id));M=null;save();render()}
function exTab(){const n=S.cols.filter(c=>!c.ex).reduce((a,c)=>a+c.cards.length,0);
return`<h1>Exercise</h1><p class=m style="margin:0 4px 12px">All collections are mixed together. Tap one to exclude it.</p>`+S.cols.map(c=>`<span class="chip ${c.ex?'':'on'}" onclick="col(${c.id}).ex=!col(${c.id}).ex;save();render()">${e(c.name)} · ${c.cards.length}</span>`).join('')+`<p><button class=btn onclick="startX(0)">Start exercise (${n} cards)</button></p>`}
function startX(id){const l=id?col(id).cards:S.cols.filter(c=>!c.ex).flatMap(c=>c.cards);if(!l.length){alert('No cards to practise yet.');return}
X={base:l.slice(),o:l.slice(),i:0,f:0,sh:0,rv:0,r:{}};cur=null;render()}
function exHTML(){const k=X.o[X.i],fr=X.rv?k.ro:k.en,bk=X.rv?k.en:k.ro,n=v=>Object.values(X.r).filter(x=>x==v).length;
return`<div class=row><button class=ar onclick="X=null;render()">✕</button><b style="flex:1;text-align:center">${X.i+1} / ${X.o.length}</b><span style="width:44px"></span></div>
<div class=row style="justify-content:center;margin:14px 0"><span class=chip style="background:var(--b);color:#fff;border-color:var(--b)">Easy ${n('e')}</span><span class=chip>Neutral ${n('n')}</span><span class=chip style="background:var(--r);color:#fff;border-color:var(--r)">Hard ${n('h')}</span></div>
<div class=row style="margin:22px 0"><button class=ar onclick="nav(-1)">‹</button><div class=sc onclick="X.f=!X.f;$('in').classList.toggle('f')"><div class="in ${X.f?'f':''}" id=in><div class=fc style="font-size:${fs(fr)}px;${k.color?`background:${k.color};color:${tc(k.color)}`:''}">${e(fr)}</div><div class="fc bk" style="font-size:${fs(bk)}px">${e(bk)}</div></div></div><button class=ar onclick="nav(1)">›</button></div>
<div class=row style="justify-content:center"><button class=btn onclick="rate('e')">Easy</button><button class="btn g" onclick="rate('n')">Neutral</button><button class=btn style="background:var(--r)" onclick="rate('h')">Hard</button></div>
<div class=row style="justify-content:center;margin-top:22px"><button class="btn g ${X.sh?'on':''}" onclick="shufX()">Shuffle</button><button class="btn g ${X.rv?'on':''}" onclick="X.rv=!X.rv;X.f=0;render()">Reverse</button><button class="btn g" onclick="restart()">Restart</button></div>`}
function nav(d){X.i=(X.i+d+X.o.length)%X.o.length;X.f=0;render()}
function rate(v){const k=X.o[X.i];k.r=v;X.r[k.id]=v;save();if(X.i<X.o.length-1){X.i++;X.f=0}render()}
function shufX(){X.sh=!X.sh;X.o=X.sh?shuffle(X.base.slice()):X.base.slice();X.i=0;X.f=0;render()}
function restart(){X.r={};X.i=0;X.f=0;X.o=X.sh?shuffle(X.base.slice()):X.base.slice();render()}
function cf(k,v){S.cfg[k]=v;save();render()}
function togOn(){if(!S.cfg.on){let ok=true;try{ok=Android.canOverlay()}catch(x){}if(!ok){alert('Allow "Display over other apps" for Romanian Flash, then come back and switch passive exposure on again.');Android.askOverlay();return}}cf('on',!S.cfg.on)}
function setHTML(){const c=S.cfg;return`<h1>Settings</h1>
<div class=li><b style="flex:1">Passive exposure</b><button class="tg ${c.on?'on':''}" onclick="togOn()"></button></div>
<div class=li style="display:block"><b>Show a card every</b><br><input type=number min=1 value="${c.every}" onchange="cf('every',+this.value||15)"> <span class=m>minutes</span><br><b>Between</b><br><input type=time value="${c.from}" onchange="cf('from',this.value)"> <span class=m>and</span> <input type=time value="${c.to}" onchange="cf('to',this.value)"></div>
<div class=li style="display:block"><b>Card face shows</b><br><span class="chip ${c.face=='en'?'on':''}" onclick="cf('face','en')">English</span><span class="chip ${c.face=='ro'?'on':''}" onclick="cf('face','ro')">Romanian</span></div>
<div class=li style="display:block"><b>Show cards from</b><br>${S.cols.map(k=>`<span class="chip ${k.ps?'on':''}" onclick="col(${k.id}).ps=!col(${k.id}).ps;save();render()">${e(k.name)}</span>`).join('')||'<span class=m>No collections yet</span>'}</div>
<p class=m style="margin:12px 6px">Easy cards pop up less often, Hard cards more often.</p>`}
render();save();
</script></body></html>
