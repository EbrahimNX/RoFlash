<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--p:#6C5CE7;--p2:#8E7CFF;--pk:#FF6FA5;--am:#FFC24B;--mt:#2ED8A7;--co:#FF5C7A;--bg:#F4F2FF;--g2:#E7E4F7;--g3:#8A87A8;--t:#1E1B3A;--gr:linear-gradient(135deg,#6C5CE7,#8E7CFF);--ga:linear-gradient(135deg,#FFC24B,#FF9F5A);--sh:0 6px 24px rgba(108,92,231,.10);--ez:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--t);overflow-x:hidden}html{overflow-x:hidden}body::before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 50% at 0 0,#E6E0FF,transparent 60%)}
button,input{font:inherit}h1{font-size:30px;margin:6px 4px 22px}h2,h3{margin:0}.m{color:var(--g3)}.row{display:flex;align-items:center;gap:10px}
#a{padding:22px 18px 200px;min-height:100vh}
@keyframes inR{from{opacity:0;transform:translate3d(18px,0,0)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translate3d(-18px,0,0)}to{opacity:1;transform:none}}
@keyframes inU{from{opacity:0;transform:translate3d(0,26px,0) scale(.98)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translate3d(0,14px,0)}to{opacity:1;transform:none}}
#a{transition:opacity .11s ease,transform .11s ease}#a.out{opacity:0;transform:translate3d(0,6px,0);pointer-events:none}
#a.pf{animation:inR .34s var(--ez)}#a.pb{animation:inL .34s var(--ez)}#a.pu{animation:inU .38s var(--ez)}
#a.an .hd,#a.an .sb,#a.an .st,#a.an .stg>*,#a.an .sec{animation:up .42s var(--ez) both;animation-delay:calc(var(--i,0)*35ms)}
body.ex #a{padding:12px 14px;height:100vh;display:flex;flex-direction:column;min-height:0}body.ex #nv{display:none}
.gr{font-size:32px;font-weight:800;letter-spacing:-.5px}.sub{font-size:14px;color:var(--g3);margin:4px 0 22px}
.sb{display:flex;align-items:center;gap:12px;background:#fff;border-radius:26px;padding:8px 8px 8px 20px;margin-bottom:26px;color:var(--p);box-shadow:var(--sh)}
.sb input{flex:1;min-width:0;border:0;outline:0;background:0;font-size:17px;color:var(--t)}
.sg{width:48px;height:48px;border-radius:18px;border:0;background:var(--gr);color:#fff;display:grid;place-items:center;box-shadow:0 6px 14px rgba(108,92,231,.35)}
.st{font-size:20px;font-weight:800;margin:0 4px 16px}
.cc{background:#fff center/cover;border-radius:28px;padding:14px 14px 16px;aspect-ratio:3/4;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--sh);transition:transform .2s}.cc:active{transform:scale(.97)}
.ct{display:flex;justify-content:flex-end;gap:8px}.cb b{display:block;font-size:17px;font-weight:800;word-break:break-word}.cb small{color:var(--g3);font-weight:600}
.cc.im{color:#fff}.cc.im small{color:#e8e6f5}
.cb2{width:34px;height:34px;border-radius:50%;border:0;background:rgba(138,135,168,.16);color:inherit;display:grid;place-items:center;font-size:19px}.cc.im .cb2{background:rgba(255,255,255,.28)}.cb2.on{background:var(--p);color:#fff}
.gd{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fcw{height:20vh;min-height:124px;perspective:900px}.fcw.hi{height:auto;aspect-ratio:1/1.2}.fi{position:relative;height:100%;transition:transform .55s var(--ez);transform-style:preserve-3d}.fcw.f .fi{transform:rotateY(180deg)}
.ff{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;font-weight:800;box-shadow:var(--sh);word-break:break-word}.bk{transform:rotateY(180deg)}
.pic{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;margin-bottom:8px;flex:none}.hi .ff{justify-content:flex-start}.hi .ff span{margin:auto 0}
.ed{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.75);color:var(--t);display:grid;place-items:center}.hi .ed{top:18px;right:18px}
#lst{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hi .ff.bk{justify-content:center}
.add{border-radius:26px;background:#faf9ff;border:2px dashed #cfc9f3;display:grid;place-items:center;height:20vh;min-height:124px;color:var(--p);font-size:42px}
.ib{width:44px;height:44px;border-radius:16px;border:0;background:#fff;display:grid;place-items:center;color:var(--t);flex:none;box-shadow:var(--sh)}.ib.on{background:var(--am)}
.sec{background:#fff;border-radius:28px;padding:22px;margin-bottom:18px;box-shadow:var(--sh)}.sec h4{margin:0 0 18px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--g3)}
.rw{display:flex;align-items:center;justify-content:space-between;gap:12px}.ico{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;font-size:20px;flex:none}
.chip{display:inline-block;border-radius:999px;padding:11px 18px;margin:0 8px 10px 0;background:var(--bg);font-weight:700;transition:.2s}.chip.on{background:var(--gr);color:#fff}
input[type=number],input[type=time]{width:96px;text-align:center;padding:12px 8px;border:2px solid var(--g2);border-radius:16px;background:#fff;font-size:17px;font-weight:700;color:var(--t)}input[type=time]{width:130px}
input[type=text]{width:100%;padding:15px 18px;border:2px solid var(--g2);border-radius:18px;font-size:16px;margin:6px 0;background:#fff;color:var(--t)}input[type=text]:focus{border-color:var(--p2);outline:0}
.seg{display:flex;background:var(--bg);border-radius:20px;padding:5px}.seg button{flex:1;border:0;background:0;padding:13px;border-radius:16px;font-weight:700;color:var(--t);transition:.25s}.seg button.on{background:var(--gr);color:#fff}
.tg{width:58px;height:34px;border-radius:999px;background:var(--g2);position:relative;border:0;flex:none;transition:.3s}
.tg::after{content:'';position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.3s var(--ez);box-shadow:0 1px 4px rgba(0,0,0,.2)}.tg.on{background:var(--gr)}.tg.on::after{left:28px}
.fab{position:fixed;right:20px;bottom:104px;width:68px;height:68px;border-radius:50%;border:0;background:var(--gr);color:#fff;font-size:42px;line-height:1;box-shadow:0 10px 24px rgba(108,92,231,.45);z-index:4;animation:up .5s var(--ez)}
.fy{position:fixed;right:20px;bottom:104px;border:0;border-radius:22px;padding:17px 30px;background:var(--ga);color:var(--t);font-size:17px;font-weight:800;box-shadow:0 10px 24px rgba(255,159,90,.45);z-index:4;animation:up .5s var(--ez)}
.go{position:fixed;left:16px;right:16px;bottom:104px;height:64px;border:0;border-radius:24px;background:var(--ga);color:var(--t);font-size:18px;font-weight:800;box-shadow:0 10px 24px rgba(255,159,90,.45);z-index:4;animation:up .5s var(--ez)}
#nv{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;background:#fff;border-radius:32px;padding:8px;box-shadow:0 12px 36px rgba(108,92,231,.22);z-index:5}
#nv button{flex:1;position:relative;z-index:1;border:0;background:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0;color:var(--g3);font-size:11px;font-weight:700;transition:color .3s}
#nv button.on{color:var(--p)}#nv button svg{transition:transform .45s var(--ez)}#nv button.on svg{transform:translateY(-2px) scale(1.18)}
.ind{position:absolute;top:8px;bottom:8px;left:8px;width:calc((100% - 16px)/3);background:#EDE9FF;border-radius:24px;transition:transform .42s cubic-bezier(.3,1.15,.5,1)}
.modal{position:fixed;inset:0;background:rgba(30,27,58,.45);display:flex;align-items:flex-end;z-index:9;animation:fi .25s}.sheet{background:#fff;width:100%;border-radius:34px 34px 0 0;padding:24px 22px 30px;max-height:92vh;overflow:auto;animation:su .45s var(--ez)}
@keyframes fi{from{opacity:0}}@keyframes su{from{transform:translateY(80px);opacity:.6}}
.btn{border:0;border-radius:18px;padding:15px 20px;font-weight:700;background:var(--bg);color:var(--t);font-size:15px}.btn.p{background:var(--gr);color:#fff}.btn.d{background:var(--co);color:#fff}
.sws{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0 20px}.s{width:40px;height:40px;border-radius:50%;border:0;box-shadow:0 0 0 2px var(--g2)}.s.on{box-shadow:0 0 0 3px var(--t)}
.pv{width:150px;aspect-ratio:4/3;object-fit:cover;border-radius:16px;margin:8px 0 14px;display:block}
.ap{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--g2)}.ck{width:26px;height:26px;border-radius:9px;border:2px solid var(--g2);display:grid;place-items:center;font-style:normal;transition:.2s}.ck.on{background:var(--p);border-color:var(--p)}.ck.on::after{content:'✓';color:#fff;font-size:15px}
.top{display:flex;align-items:center;gap:8px}.cn{border-radius:11px;padding:5px 11px;font-size:12px;font-weight:800;color:#fff}
.xc{flex:1;min-height:0;margin:12px 0 14px;touch-action:pan-y;perspective:1200px}.xw{height:100%;animation:up .4s var(--ez)}.xi{position:relative;height:100%;transition:transform .6s var(--ez);transform-style:preserve-3d}.xi.f{transform:rotateY(180deg)}
.xf{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:34px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;font-weight:800;box-shadow:0 12px 36px rgba(108,92,231,.14);word-break:break-word}.xf.bk{color:var(--p)}
.xf .pic{width:auto;max-width:100%;max-height:42%;margin-bottom:16px}
.rb{display:flex;gap:10px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}.rb button{flex:1;height:64px;border:0;border-radius:20px;font-weight:800;font-size:16px;color:#fff;transition:transform .15s}.rb button:active{transform:scale(.95)}
#ts{position:fixed;top:18px;left:50%;transform:translate(-50%,-100px);background:var(--t);color:#fff;padding:13px 22px;border-radius:999px;z-index:100;transition:transform .4s var(--ez);font-size:14px;max-width:90vw;text-align:center}#ts.sh{transform:translate(-50%,0)}
#sp{position:fixed;inset:0;z-index:99;background:#fff;animation:spo .5s 3.2s forwards}
#sp i{position:absolute;top:0;width:33.4%;height:100%;clip-path:circle(0 at 50% 85%);animation:rev .9s .9s cubic-bezier(.2,.8,.2,1) forwards}
#sp i:nth-child(2){animation-delay:1.15s}#sp i:nth-child(3){animation-delay:1.4s}
#sp u{position:absolute;top:50%;width:26px;height:26px;margin-top:-13px;border-radius:50%;transform:scale(0);animation:bn .9s forwards}
#sp u:nth-of-type(1){left:calc(50% - 50px);background:#002B7F}#sp u:nth-of-type(2){left:calc(50% - 13px);background:#FCD116;animation-delay:.15s}#sp u:nth-of-type(3){left:calc(50% + 24px);background:#CE1126;animation-delay:.3s}
@keyframes rev{to{clip-path:circle(80% at 50% 50%)}}
@keyframes bn{0%{transform:scale(0) translateY(40px)}40%{transform:scale(1.3) translateY(-30px)}70%{transform:scale(1) translateY(0)}100%{transform:scale(0)}}
@keyframes spo{to{opacity:0;visibility:hidden;transform:scale(1.12)}}
</style></head><body>
<div id="a"></div><div id="fb"></div><nav id="nv"></nav><div id="ts"></div><input type="file" id="fi" accept="image/*" hidden onchange="readImg(this)">
<div id="sp"><u></u><u></u><u></u><i style="left:0;background:#002B7F"></i><i style="left:33.3%;background:#FCD116"></i><i style="left:66.6%;background:#CE1126"></i></div>
<script>
const $=i=>document.getElementById(i),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ic=(d,z=22)=>`<svg width=${z} height=${z} viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round>${d}</svg>`;
const I={search:ic('<circle cx=11 cy=11 r=7 /><path d="m20 20-3.5-3.5"/>',28),arrow:ic('<path d="M5 12h14M13 6l6 6-6 6"/>',24),pin:ic('<path d="M12 17v5M9 3h6l-1 6 3 3v2H7v-2l3-3-1-6z"/>',18),
edit:ic('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',16),shuffle:ic('<path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>'),rev:ic('<path d="M7 7h13l-3-3M17 17H4l3 3"/>'),
restart:ic('<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>'),close:ic('<path d="M18 6 6 18M6 6l12 12"/>'),back:ic('<path d="m15 18-6-6 6-6"/>'),
home:ic('<path d="M3 11 12 3l9 8v10h-6v-6H9v6H3z"/>'),bolt:ic('<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>'),sliders:ic('<path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx=15 cy=6 r=2.5 /><circle cx=9 cy=12 r=2.5 /><circle cx=17 cy=18 r=2.5 />')};
const PC=['#FFFFFF','#FFE0EC','#FFF1C9','#D9F7EC','#DDEBFF','#EAE3FF','#FFD9C7','#FF6FA5','#FFC24B','#2ED8A7','#4FC3F7','#6C5CE7','#FF5C7A','#1E1B3A'];
const uid=()=>Date.now()*10+Math.floor(Math.random()*10);
const tc=h=>{const n=parseInt(h.slice(1),16);return((n>>16)*.299+((n>>8)&255)*.587+(n&255)*.114)>160?'#1E1B3A':'#fff'};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fx=t=>t.length>40?24:t.length>18?32:44,fg=t=>t.length>40?14:t.length>18?17:21;
var LOADED=0;
function load(){let r='';try{r=Android.load()}catch(x){}
for(const q of [r,localStorage.v2]){if(q)try{const o=JSON.parse(q);if(o&&o.cols){LOADED=1;return o}}catch(x){}}
const n={cols:[],cfg:{}};
try{JSON.parse(localStorage.d).sets.forEach(s=>n.cols.push({id:s.id,name:s.name,ex:false,ps:true,cards:s.cards.map((c,j)=>({id:s.id+j,en:c.b,ro:c.f,color:'#FFFFFF'}))}))}catch(x){}return n}
let S=load(),T=0,cur=null,X=null,M=null,Q='',FL={},APPS=[];
S.cfg=Object.assign({on:false,every:15,all:false,from:'08:00',to:'22:00',face:'ro',name:'Ebrahim',pics:false,skip:[]},S.cfg);
const col=id=>S.cols.find(c=>c.id==id);
const findCard=id=>{for(const c of S.cols){const k=c.cards.find(k=>k.id==id);if(k)return k}};
const save=()=>{const j=JSON.stringify(S);try{localStorage.v2=j}catch(x){}try{Android.save(j,JSON.stringify(S,(k,v)=>k=='img'||k=='pic'?undefined:v))}catch(x){}};
const toast=(m,ms=2400)=>{const t=$('ts');t.textContent=m;t.classList.add('sh');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('sh'),ms)};
function anim(m){const a=$('a');a.classList.remove('pf','pb','pu','an');void a.offsetWidth;a.classList.add(m,'an');clearTimeout(anim.t);anim.t=setTimeout(()=>a.classList.remove('an'),1200)}
function back(){if(M)M=null;else if(X)X=null;else if(cur)cur=null;else if(T!=0)T=0;else return false;render('pb');return true}
function tab(i){const m=i>T?'pf':'pb';T=i;cur=null;render(m)}
let busy=0;
function render(m){if(!m||busy){doRender(m);return}busy=1;const a=$('a');a.classList.add('out');setTimeout(()=>{busy=0;a.classList.remove('out');doRender(m)},110)}
function doRender(m){document.body.classList.toggle('ex',!!X);
$('a').innerHTML=(X?exHTML():cur?colHTML():[listHTML,exTab,setHTML][T]())+(M?modal():'');
const n=S.cols.filter(c=>!c.ex).reduce((a,c)=>a+c.cards.length,0);
$('fb').innerHTML=X||M?'':cur?`<button class=fy onclick="startX(${cur})">Exercise</button>`:T==0?`<button class=fab onclick="M={t:'col',id:0};render()">+</button>`:T==1?`<button class=go onclick="startX(0)">Start exercise · ${n} cards</button>`:'';
$('ind').style.transform=`translateX(${T*100}%)`;document.querySelectorAll('#nv button').forEach((b,i)=>b.classList.toggle('on',i==T));
if(m)anim(m);if(M&&$('i1'))$('i1').focus()}
$('nv').innerHTML='<div class=ind id=ind></div>'+['Home','Exercise','Preferences'].map((l,i)=>`<button onclick="tab(${i})">${[I.home,I.bolt,I.sliders][i]}<span>${l}</span></button>`).join('');
function pin(id){const c=col(id);c.pin=!c.pin;save();render()}
function items(){const l=S.cols.filter(c=>c.name.toLowerCase().includes(Q.toLowerCase())).sort((a,b)=>(b.pin?1:0)-(a.pin?1:0));
return l.map((c,n)=>`<div class="cc ${c.img?'im':''}" style="--i:${Math.min(n+3,9)};${c.img?`background-image:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,0) 62%),url(${c.img})`:''}" onclick="cur=${c.id};render('pf')"><div class=ct><button class="cb2 ${c.pin?'on':''}" onclick="event.stopPropagation();pin(${c.id})">${I.pin}</button><button class=cb2 onclick="event.stopPropagation();M={t:'col',id:${c.id}};render()">⋮</button></div><div class=cb><b>${e(c.name)}</b><small>${c.cards.length} cards</small></div></div>`).join('')||`<p class=m style="grid-column:1/-1;text-align:center;margin-top:40px">${S.cols.length?'No collection found':'Tap + to add your first collection'}</p>`}
function listHTML(){return`<div class=hd style="--i:0"><div class=gr>Bună, ${e(S.cfg.name||'Ebrahim')}</div><div class=sub>Hai să învățăm limba română!</div></div><div class=sb style="--i:1">${I.search}<input id=q placeholder="Search" value="${e(Q)}" oninput="Q=this.value;$('lst').innerHTML=items()"><button class=sg onclick="$('q').blur()">${I.arrow}</button></div><h2 class=st style="--i:2">Your collections</h2><div id=lst class=stg>${items()}</div>`}
function flip(el,id){FL[id]=!FL[id];el.classList.toggle('f')}
function colHTML(){const c=col(cur);return`<div class=row style="margin-bottom:22px"><button class=ib onclick="cur=null;render('pb')">${I.back}</button><h2 style="font-size:24px;font-weight:800">${e(c.name)}</h2></div><div class="gd stg">`+
c.cards.map((k,n)=>{const bg=k.color||'#FFFFFF',w=bg.toUpperCase()=='#FFFFFF';return`<div class="fcw ${k.pic?'hi':''} ${FL[k.id]?'f':''}" style="--i:${Math.min(n,9)}" onclick="flip(this,${k.id})"><div class=fi><div class=ff style="background:${bg};color:${tc(bg)}">${k.pic?`<img class=pic src="${k.pic}">`:''}<span style="font-size:${fg(k.ro)}px">${e(k.ro)}</span><button class=ed onclick="event.stopPropagation();M={t:'card',id:${k.id}};render()">${I.edit}</button></div><div class="ff bk" style="background:${w?'var(--gr)':bg};color:${w?'#fff':tc(bg)};font-size:${fg(k.en)}px">${e(k.en)}</div></div></div>`}).join('')+`<div class=add style="--i:${Math.min(c.cards.length,9)}" onclick="M={t:'card',id:0};render()">+</div></div>`}
function modal(){if(M.t=='apps')return appsModal();const isC=M.t=='col',k=(isC?col(M.id):findCard(M.id))||{};
if(!M.init){M.init=1;M.v1=isC?k.name||'':k.ro||'';M.v2=k.en||'';M.color=k.color||'#FFFFFF';M.pin=!!k.pin;M.img=k.img||'';M.pic=k.pic||''}
return`<div class=modal onclick="if(event.target==this)back()"><div class=sheet><h3 style="margin-bottom:14px">${isC?(M.id?'Edit collection':'New collection'):(M.id?'Edit card':'New card')}</h3>`+
(isC?`<input type=text id=i1 placeholder="Collection name" value="${e(M.v1)}" oninput="M.v1=this.value">`+(M.id?`<div class=row style="flex-wrap:wrap;margin:12px 0 22px"><button class="btn ${M.pin?'p':''}" onclick="M.pin=!M.pin;render()">${M.pin?'Pinned':'Pin to top'}</button><button class=btn onclick="pickImg()">${M.img?'Change image':'Add image'}</button><button class=btn onclick="exp(${M.id})">Export .txt</button>${M.img?'<button class=btn onclick="M.img=\'\';render()">Remove image</button>':''}</div>`:'<div style="height:14px"></div>'):
`<input type=text id=i1 placeholder="Romanian" value="${e(M.v1)}" oninput="M.v1=this.value"><input type=text id=i2 placeholder="English" value="${e(M.v2)}" oninput="M.v2=this.value"><div class=row style="flex-wrap:wrap;margin:10px 0 4px"><button class=btn onclick="pickImg()">${M.pic?'Change photo':'Add photo (4:3)'}</button>${M.pic?'<button class=btn onclick="M.pic=\'\';render()">Remove photo</button>':''}</div>${M.pic?`<img class=pv src="${M.pic}">`:''}<div class=sws>`+PC.map(p=>`<button class="s ${M.color.toUpperCase()==p.toUpperCase()?'on':''}" style="background:${p}" onclick="M.color='${p}';render()"></button>`).join('')+'</div>')+
`<div class=row><button class="btn p" style="flex:1" onclick="msave()">Save</button>${M.id?`<button class="btn d" onclick="mdel()">${M.del?'Tap again to delete':'Delete'}</button>`:''}</div></div></div>`}
function exp(id){const cs=id?[col(id)]:S.cols;if(!cs.length)return toast('Nothing to export');
const t=cs.map(c=>`${c.name}\n${'='.repeat(c.name.length)}\n`+(c.cards.map(k=>`${k.ro} - ${k.en}`).join('\n')||'(no cards)')).join('\n\n')+'\n';
const n=(id?cs[0].name:'Ro Flash collections').replace(/[\\/:*?"<>|]/g,'').trim()||'collection';
try{Android.exportTxt(n+'.txt',t)}catch(x){toast('Export is not available')}}
function pickImg(){$('fi').value='';$('fi').click()}
function readImg(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const mx=M.t=='col'?700:480,s=Math.min(1,mx/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);const u=c.toDataURL('image/jpeg',.72);if(M.t=='col')M.img=u;else M.pic=u;render()};i.src=r.result};r.readAsDataURL(f)}
function msave(){const a=(M.v1||'').trim();if(!a)return toast('Please enter a name');
if(M.t=='col'){let c=M.id&&col(M.id);if(!c){c={id:uid(),cards:[],ex:false,ps:true};S.cols.push(c)}c.name=a;c.pin=M.pin;c.img=M.img}
else{const b=(M.v2||'').trim();if(!b)return toast('Add both Romanian and English');let k=M.id&&findCard(M.id);if(!k){k={id:uid()};col(cur).cards.push(k)}k.ro=a;k.en=b;k.color=M.color;k.pic=M.pic}
M=null;save();render()}
function mdel(){if(!M.del){M.del=1;render();return}if(M.t=='col'){S.cols=S.cols.filter(c=>c.id!=M.id);if(cur==M.id)cur=null}else S.cols.forEach(c=>c.cards=c.cards.filter(k=>k.id!=M.id));M=null;save();render()}
function openApps(){try{APPS=JSON.parse(Android.apps())}catch(x){APPS=[]}M={t:'apps',init:1,q:''};render()}
function appRows(){const q=(M.q||'').toLowerCase();return APPS.filter(a=>a.n.toLowerCase().includes(q)).map(a=>`<div class=ap onclick="togApp('${a.p}')"><span>${e(a.n)}</span><i class="ck ${S.cfg.skip.includes(a.p)?'on':''}"></i></div>`).join('')||'<p class=m>No apps found</p>'}
function togApp(p){const s=S.cfg.skip,i=s.indexOf(p);i<0?s.push(p):s.splice(i,1);save();$('al').innerHTML=appRows()}
function appsModal(){return`<div class=modal onclick="if(event.target==this)back()"><div class=sheet style="height:80vh"><h3>Don't show popups over</h3><p class=m style="margin:6px 0 10px">Tick the apps where cards should stay hidden.</p><input type=text id=i3 placeholder="Search apps" value="${e(M.q)}" oninput="M.q=this.value;$('al').innerHTML=appRows()"><div id=al>${appRows()}</div></div></div>`}
function exTab(){return`<h1>Exercise</h1><div class=sec><h4>Include in exercise</h4>`+(S.cols.map(c=>`<span class="chip ${c.ex?'':'on'}" onclick="col(${c.id}).ex=!col(${c.id}).ex;save();render()">${e(c.name)} · ${c.cards.length}</span>`).join('')||'<span class=m>No collections yet</span>')+`</div><p class=m style="margin:0 8px">Cards from all included collections are mixed together. Words you mark Hard show up more often in popups.</p>`}
function startX(id){const l=id?col(id).cards:S.cols.filter(c=>!c.ex).flatMap(c=>c.cards);if(!l.length){toast('No cards to practise yet');return}
X={base:l.slice(),o:l.slice(),i:0,f:0,sh:0,rv:0,r:{}};cur=null;render('pu')}
function exHTML(){const k=X.o[X.i],fr=X.rv?k.en:k.ro,bk=X.rv?k.ro:k.en,n=v=>Object.values(X.r).filter(x=>x==v).length;
return`<div class=top><button class=ib onclick="X=null;render('pb')">${I.close}</button><button class="ib ${X.sh?'on':''}" onclick="shufX()">${I.shuffle}</button><button class="ib ${X.rv?'on':''}" onclick="X.rv=!X.rv;X.f=0;render()">${I.rev}</button><button class=ib onclick="restart()">${I.restart}</button><span style="flex:1"></span><span class=cn style="background:var(--mt)">${n('e')}</span><span class=cn style="background:var(--am);color:var(--t)">${n('n')}</span><span class=cn style="background:var(--co)">${n('h')}</span></div>
<p class=m style="text-align:center;margin:12px 0 0;font-size:13px;font-weight:700">${X.i+1} / ${X.o.length}</p>
<div class=xc onpointerdown="ds(event)" onpointermove="dm(event)" onpointerup="de()" onpointercancel="de()"><div class=xw id=sw><div class="xi ${X.f?'f':''}" id=in><div class=xf style="font-size:${fx(fr)}px">${!X.rv&&k.pic?`<img class=pic src="${k.pic}">`:''}<span>${e(fr)}</span></div><div class="xf bk" style="font-size:${fx(bk)}px">${X.rv&&k.pic?`<img class=pic src="${k.pic}">`:''}<span>${e(bk)}</span></div></div></div></div>
<div class=rb><button style="background:var(--mt)" onclick="rate('e')">Easy</button><button style="background:var(--am);color:var(--t)" onclick="rate('n')">Neutral</button><button style="background:var(--co)" onclick="rate('h')">Hard</button></div>`}
let d0=null,dx=0,mv=false;
function ds(ev){d0=ev.clientX;dx=0;mv=false;try{ev.currentTarget.setPointerCapture(ev.pointerId)}catch(x){}}
function dm(ev){if(d0===null)return;dx=ev.clientX-d0;if(Math.abs(dx)>10)mv=true;if(mv){const w=$('sw');w.style.animation='none';w.style.transition='none';w.style.transform=`translateX(${dx}px) rotate(${dx/30}deg)`}}
function de(){if(d0===null)return;d0=null;const w=$('sw');if(!mv){X.f=!X.f;$('in').classList.toggle('f');return}
if(Math.abs(dx)>90){w.style.transition='transform .28s,opacity .28s';w.style.transform=`translateX(${dx>0?'110vw':'-110vw'})`;w.style.opacity=0;const d=dx;setTimeout(()=>nav(d>0?-1:1),230)}else{w.style.transition='transform .3s var(--ez)';w.style.transform=''}}
function nav(d){X.i=(X.i+d+X.o.length)%X.o.length;X.f=0;render()}
function rate(v){const k=X.o[X.i];k.r=v;X.r[k.id]=v;save();
if(X.i<X.o.length-1){X.i++;X.f=0;render();return}
const n=q=>Object.values(X.r).filter(x=>x==q).length,msg=`Finished! Easy ${n('e')} · Neutral ${n('n')} · Hard ${n('h')}`;X=null;render('pb');toast(msg,3500)}
function shufX(){X.sh=!X.sh;X.o=X.sh?shuffle(X.base.slice()):X.base.slice();X.i=0;X.f=0;render()}
function restart(){X.r={};X.i=0;X.f=0;X.o=X.sh?shuffle(X.base.slice()):X.base.slice();render()}
function cf(k,v){S.cfg[k]=v;save();render()}
function togOn(){if(!S.cfg.on){let ok=true;try{ok=Android.canOverlay()}catch(x){}if(!ok){toast('Allow "Display over other apps", then switch it on again');Android.askOverlay();return}}cf('on',!S.cfg.on)}
function setHTML(){const c=S.cfg;let us=false;try{us=Android.hasUsage()}catch(x){}let n=0;const sc=(h)=>`class=sec style="--i:${n++}"`;
return`<h1>Preferences</h1>
<div ${sc()}><h4>Profile</h4><input type=text value="${e(c.name)}" placeholder="Your name" onchange="cf('name',this.value.trim()||'Ebrahim')"></div>
<div ${sc()}><div class=rw><div class=row><span class=ico style="background:#EDE9FF">🔔</span><div><b>Passive exposure</b><br><small class=m>Pop up cards over other apps</small></div></div><button class="tg ${c.on?'on':''}" onclick="togOn()"></button></div></div>
<div ${sc()}><h4>Frequency</h4><div class=rw><span>Show a card every</span><span class=row><input type=number min=1 value="${c.every}" onchange="cf('every',+this.value||15)"><span class=m>min</span></span></div></div>
<div ${sc()}><h4>Between</h4><div class=rw><span>All day</span><button class="tg ${c.all?'on':''}" onclick="cf('all',!S.cfg.all)"></button></div>${c.all?'':`<div class=rw style="margin-top:20px"><input type=time value="${c.from}" onchange="cf('from',this.value)"><span class=m>to</span><input type=time value="${c.to}" onchange="cf('to',this.value)"></div>`}</div>
<div ${sc()}><h4>Card face</h4><div class=seg><button class="${c.face=='ro'?'on':''}" onclick="cf('face','ro')">Romanian</button><button class="${c.face=='en'?'on':''}" onclick="cf('face','en')">English</button></div><div class=rw style="margin-top:20px"><span>Include pictures in popups</span><button class="tg ${c.pics?'on':''}" onclick="cf('pics',!S.cfg.pics)"></button></div></div>
<div ${sc()}><h4>Show cards from</h4>${S.cols.map(k=>`<span class="chip ${k.ps?'on':''}" onclick="col(${k.id}).ps=!col(${k.id}).ps;save();render()">${e(k.name)}</span>`).join('')||'<span class=m>No collections yet</span>'}</div>
<div ${sc()}><h4>Hide popups in apps</h4><div class=rw><span>${c.skip.length?c.skip.length+' apps hidden':'No apps chosen'}</span><button class="btn p" onclick="openApps()">Choose apps</button></div>${us?'':'<p class=m style="margin:16px 0 10px;font-size:13px">To know which app is open, Ro Flash needs Usage access.</p><button class=btn onclick="Android.askUsage()">Grant usage access</button>'}</div>
<div ${sc()}><h4>Backup</h4><div class=rw><span>All collections as text</span><button class="btn p" onclick="exp(0)">Export .txt</button></div></div>
<p class=m style="margin:0 8px">Easy cards appear less often, Hard cards more often.</p>`}
render();if(LOADED||S.cols.length)save();
</script></body></html>
