name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.5 }
      - name: Generate project files
        run: |
          mkdir -p $(dirname settings.gradle.kts)
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "RoFlash"
          include(":app")
          EOF
          mkdir -p $(dirname build.gradle.kts)
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF
          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          EOF
          mkdir -p $(dirname app/build.gradle.kts)
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.ebrahim.roflash"
              compileSdk = 34
              defaultConfig { applicationId = "com.ebrahim.roflash"; minSdk = 26; targetSdk = 33; versionCode = 1; versionName = "1.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application android:label="Romanian Flash" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".OverlayService" android:exported="false"/>
              </application>
          </manifest>
          EOF
          mkdir -p $(dirname app/src/main/java/com/ebrahim/roflash/MainActivity.kt)
          cat > app/src/main/java/com/ebrahim/roflash/MainActivity.kt <<'EOF'
          package com.ebrahim.roflash

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.webkit.JavascriptInterface
          import android.webkit.WebView
          import org.json.JSONObject

          class MainActivity : Activity() {
              private lateinit var wv: WebView
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  if (android.os.Build.VERSION.SDK_INT >= 33)
                      requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 1)
                  wv = WebView(this); setContentView(wv)
                  wv.settings.javaScriptEnabled = true
                  wv.settings.domStorageEnabled = true
                  wv.addJavascriptInterface(Bridge(), "Android")
                  wv.loadUrl("file:///android_asset/index.html")
              }
              @Deprecated("old api") override fun onBackPressed() {
                  wv.evaluateJavascript("back()") { if (it != "true") finish() }
              }
              inner class Bridge {
                  @JavascriptInterface fun canOverlay() = Settings.canDrawOverlays(this@MainActivity)
                  @JavascriptInterface fun askOverlay() {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                  }
                  @JavascriptInterface fun sync(json: String) {
                      getSharedPreferences("p", 0).edit().putString("data", json).apply()
                      val on = JSONObject(json).optJSONObject("cfg")?.optBoolean("on") ?: false
                      val i = Intent(this@MainActivity, OverlayService::class.java)
                      if (on && Settings.canDrawOverlays(this@MainActivity)) startForegroundService(i) else stopService(i)
                  }
              }
          }
          EOF
          mkdir -p $(dirname app/src/main/java/com/ebrahim/roflash/OverlayService.kt)
          cat > app/src/main/java/com/ebrahim/roflash/OverlayService.kt <<'EOF'
          package com.ebrahim.roflash

          import android.app.*
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.*
          import android.provider.Settings
          import android.view.*
          import android.widget.TextView
          import org.json.JSONObject
          import java.util.Calendar

          class OverlayService : Service() {
              private val h = Handler(Looper.getMainLooper())
              private var box: View? = null
              private var running = false
              private val hideR = Runnable { hide() }

              private val tick = object : Runnable {
                  override fun run() {
                      val c = cfg()
                      val hr = Calendar.getInstance().get(Calendar.HOUR_OF_DAY)
                      val s = c.optInt("start", 8); val e = c.optInt("end", 22)
                      val inWindow = if (s <= e) hr in s until e else hr >= s || hr < e
                      if (inWindow && box == null && Settings.canDrawOverlays(this@OverlayService)) show(c)
                      h.postDelayed(this, c.optInt("interval", 15).coerceAtLeast(1) * 60000L)
                  }
              }

              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("p", "Passive exposure", NotificationManager.IMPORTANCE_MIN))
                  startForeground(1, Notification.Builder(this, "p")
                      .setContentTitle("Passive exposure is on")
                      .setSmallIcon(android.R.drawable.ic_menu_agenda).build())
                  if (!running) { running = true; h.postDelayed(tick, cfg().optInt("interval", 15).coerceAtLeast(1) * 60000L) }
                  return START_STICKY
              }

              override fun onDestroy() { h.removeCallbacksAndMessages(null); hide(); running = false }

              private fun data() = JSONObject(getSharedPreferences("p", 0).getString("data", "{}")!!)
              private fun cfg() = data().optJSONObject("cfg") ?: JSONObject()

              private fun show(c: JSONObject) {
                  val sets = data().optJSONArray("sets") ?: return
                  val list = ArrayList<Pair<String, String>>()
                  for (i in 0 until sets.length()) {
                      val s = sets.getJSONObject(i)
                      if (!s.optBoolean("passive", true)) continue
                      val cs = s.getJSONArray("cards")
                      for (j in 0 until cs.length()) cs.getJSONObject(j).let { list.add(it.getString("f") to it.getString("b")) }
                  }
                  if (list.isEmpty()) return
                  val p = list.random()
                  val front = if (c.optBoolean("rev")) p.second else p.first
                  val back = if (c.optBoolean("rev")) p.first else p.second
                  var shown = false
                  val tv = TextView(this).apply {
                      text = "$front\n\n(tap to reveal)"
                      textSize = 26f; setTextColor(Color.WHITE); gravity = Gravity.CENTER
                      setPadding(48, 48, 48, 48)
                      background = GradientDrawable().apply { setColor(Color.parseColor("#EE1F2937")); cornerRadius = 40f }
                      setOnClickListener {
                          if (!shown) {
                              shown = true; text = "$front\nâ€” â€” â€”\n$back"
                              h.removeCallbacks(hideR); h.postDelayed(hideR, 8000)
                          } else hide()
                      }
                  }
                  val lp = WindowManager.LayoutParams(
                      (resources.displayMetrics.widthPixels * 0.9).toInt(), WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT
                  ).apply { gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL; y = 220 }
                  getSystemService(WindowManager::class.java).addView(tv, lp)
                  box = tv
                  h.postDelayed(hideR, 10000)
              }

              private fun hide() {
                  h.removeCallbacks(hideR)
                  box?.let { try { getSystemService(WindowManager::class.java).removeView(it) } catch (_: Exception) {} }
                  box = null
              }
          }
          EOF
          mkdir -p $(dirname app/src/main/assets/index.html)
          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <style>
          :root{--bg:#f4f5f9;--c:#fff;--t:#1f2937;--p:#4255ff;--m:#6b7280}
          @media(prefers-color-scheme:dark){:root{--bg:#0a092d;--c:#2e3056;--t:#fff;--p:#8c9bff;--m:#a0a4c8}}
          *{box-sizing:border-box}body{margin:0;padding:16px;font-family:system-ui,sans-serif;background:var(--bg);color:var(--t)}
          h1{font-size:24px;margin:4px 0 14px}.c{background:var(--c);border-radius:12px;padding:14px;margin:10px 0}
          small{color:var(--m)}input{width:100%;padding:12px;margin:4px 0;border:1px solid var(--m);border-radius:8px;background:var(--bg);color:var(--t);font-size:16px}
          button{padding:12px 16px;margin:4px 4px 4px 0;border:0;border-radius:8px;background:var(--p);color:#fff;font-size:15px}
          button.g{background:var(--c);color:var(--t)}button.r{background:#d33}button.on{outline:3px solid var(--p);outline-offset:1px}
          .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
          .card{min-height:240px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:30px;padding:24px;margin:16px 0}
          </style></head><body><div id="a"></div><script>
          let S=JSON.parse(localStorage.d||'{"sets":[],"cfg":{"on":false,"interval":15,"start":8,"end":22,"rev":false}}');
          let V={n:'home'};const A=document.getElementById('a');
          const save=()=>{const j=JSON.stringify(S);localStorage.d=j;try{Android.sync(j)}catch(x){}};
          const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
          const get=id=>S.sets.find(s=>s.id==id);
          function go(n,x){V=Object.assign({n},x);render()}
          function back(){if(V.n=='home')return false;V.n=='study'?go('set',{id:V.id}):go('home');return true}
          function addSet(){const n=document.getElementById('n').value.trim();if(!n)return;const id=Date.now();S.sets.push({id,name:n,cards:[],passive:true});save();go('set',{id})}
          function addCard(){const f=document.getElementById('f').value.trim(),b=document.getElementById('b').value.trim();if(!f||!b)return;get(V.id).cards.push({f,b});save();render();document.getElementById('f').focus()}
          function delCard(i){get(V.id).cards.splice(i,1);save();render()}
          function delSet(){if(confirm('Delete this set?')){S.sets=S.sets.filter(s=>s.id!=V.id);save();go('home')}}
          function togPassive(){const s=get(V.id);s.passive=!(s.passive!==false);save();render()}
          function study(){go('study',{id:V.id,o:[...get(V.id).cards.keys()],i:0,fl:0,sh:0,rv:0})}
          function shuf(){V.sh=!V.sh;V.o=[...get(V.id).cards.keys()];if(V.sh)for(let i=V.o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[V.o[i],V.o[j]]=[V.o[j],V.o[i]]}V.i=0;V.fl=0;render()}
          function rev(){V.rv=!V.rv;V.fl=0;render()}
          function nav(d){const n=V.o.length;V.i=(V.i+d+n)%n;V.fl=0;render()}
          function cfgSet(k,v){S.cfg[k]=v;save();render()}
          function togOn(){if(!S.cfg.on){let ok=true;try{ok=Android.canOverlay()}catch(x){}if(!ok){alert('Allow "Display over other apps" for Romanian Flash, then come back and switch it on again.');Android.askOverlay();return}}cfgSet('on',!S.cfg.on)}
          function render(){let h='';const s=V.id&&get(V.id);
          if(V.n=='home'){h=`<h1>Romanian Flash</h1><button class=g onclick="go('cfg')">âš™ Passive exposure ${S.cfg.on?'Â· ON':'Â· off'}</button>`+S.sets.map(x=>`<div class=c onclick="go('set',{id:${x.id}})"><b>${e(x.name)}</b><br><small>${x.cards.length} cards</small></div>`).join('')+`<div class=c><input id=n placeholder="New set name"><button onclick="addSet()">Create set</button></div>`}
          else if(V.n=='set'){h=`<button class=g onclick="back()">â†</button><h1>${e(s.name)}</h1><button onclick="study()" ${s.cards.length?'':'disabled'}>Study (${s.cards.length})</button><button class="g ${s.passive!==false?'on':''}" onclick="togPassive()">Passive: ${s.passive!==false?'included':'excluded'}</button><div class=c><input id=f placeholder="Romanian word"><input id=b placeholder="Translation"><button onclick="addCard()">Add card</button></div>`+s.cards.map((c,i)=>`<div class="c row"><span><b>${e(c.f)}</b> â€” ${e(c.b)}</span><button class=g onclick="delCard(${i})">âœ•</button></div>`).join('')+`<button class=r onclick="delSet()">Delete set</button>`}
          else if(V.n=='study'){const c=s.cards[V.o[V.i]],fr=V.rv?c.b:c.f,bk=V.rv?c.f:c.b;h=`<div class=row><button class=g onclick="back()">â†</button><small>${V.i+1} / ${V.o.length}</small></div><div class="c card" onclick="V.fl=!V.fl;render()">${e(V.fl?bk:fr)}</div><div class=row><button class=g onclick="nav(-1)">â—€ Prev</button><button class=g onclick="nav(1)">Next â–¶</button></div><button class="g ${V.sh?'on':''}" onclick="shuf()">ðŸ”€ Shuffle</button><button class="g ${V.rv?'on':''}" onclick="rev()">â‡„ Reverse</button><p><small>Tap card to flip</small></p>`}
          else{const c=S.cfg;h=`<button class=g onclick="back()">â†</button><h1>Passive exposure</h1><div class=c><button class="${c.on?'':'g'}" onclick="togOn()">${c.on?'ON â€” tap to stop':'OFF â€” tap to start'}</button><p><small>Random cards pop up over other apps during your time window. Tap once to reveal, tap again to dismiss.</small></p></div><div class=c>Every (minutes)<input type=number min=1 value="${c.interval}" onchange="cfgSet('interval',+this.value||15)">From hour (0-23)<input type=number min=0 max=23 value="${c.start}" onchange="cfgSet('start',+this.value)">Until hour (0-23)<input type=number min=0 max=23 value="${c.end}" onchange="cfgSet('end',+this.value)"><button class="g ${c.rev?'on':''}" onclick="cfgSet('rev',!S.cfg.rev)">â‡„ Show translation first</button></div>`}
          A.innerHTML=h}
          render();save();
          </script></body></html>
          EOF
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: RoFlash-apk, path: app/build/outputs/apk/debug/app-debug.apk }
